[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ur-arms-manager"
version = "0.1.0"
description = "Lightweight central manager for 2-3 Universal Robots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "paramiko>=3.4",
  "fastapi>=0.111",
  "Jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "ur-rtde>=1.5",
]

[project.scripts]
uam = "ur_arms_manager.cli:main"
uam-gui = "ur_arms_manager.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"ur_arms_manager.gui" = ["templates/*.html", "static/*.css"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
