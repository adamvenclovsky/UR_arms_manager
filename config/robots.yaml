robots:
  robot1:
    host: 127.0.0.1
    dashboard_port: 29991
    script_port: 30022
    rtde_port: 30024
    ssh_port: 2222
    ssh_username: root
    ssh_password: easybot
    enabled: true
    assigned_program: /ursim/programs.UR5/final_project/final.urp
  robot2:
    # Physical UR arm template.
    # Fill in the robot IP address from PolyScope:
    #   Settings / System / Network -> IP address
    host: 192.168.0.96
    # Standard UR Dashboard Server port.
    dashboard_port: 29999
    # Standard UR Secondary client / script socket port.
    script_port: 30002
    # Standard UR RTDE port.
    rtde_port: 30004
    # SSH/SFTP port on the robot controller.
    # Needed only for file operations in this app:
    # browse robot storage, upload/download, delete, move, copy.
    # Dashboard status/load/play can work without SSH.
    ssh_port: 22
    # Fill in SSH/SFTP credentials if SSH is enabled on the robot.
    # UR documentation/tutorials commonly use root/easybot, but a physical
    # robot may use a changed password or may have SSH disabled by the lab.
    # If you will not use robot-side file operations, these can stay empty.
    ssh_username: root
    ssh_password: easybot
    # Keep disabled until host and credentials are filled and network is verified.
    enabled: true
    # Fill in the robot-side program path after deploying or locating the .urp,
    # for example: /programs/final_project/final.urp
    assigned_program: null
  robot3:
    host: 127.0.0.1
    dashboard_port: 29993
    script_port: 30023
    ssh_port: 22
    ssh_username: root
    ssh_password: easybot
    enabled: false
    assigned_program: null
