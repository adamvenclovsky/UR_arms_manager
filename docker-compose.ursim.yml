services:
  ursim1:
    image: ursim-e-series-ssh
    build:
      context: ./ursim-ssh-image
    container_name: ursim1
    ports:
      - "6080:6080"
      - "2222:22"
      - "29991:29999"
      - "30021:30001"
      - "30022:30002"
      - "30023:30003"
      - "30024:30004"
      - "30025:30011"
