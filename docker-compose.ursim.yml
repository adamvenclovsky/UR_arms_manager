      - "6081:6080"
      - "2223:22"
      - "29992:29999"
      - "30121:30001"
      - "30122:30002"
      - "30123:30003"
      - "30124:30004"
      - "30125:30011"
    volumes:
      - ./ursim-urcaps:/urcaps
