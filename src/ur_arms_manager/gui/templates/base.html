<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} | UR Arms Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div>
          <a class="brand" href="{{ url_for('index') }}">UR Arms Manager</a>
          <p class="tagline">Operator GUI foundation</p>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ url_for('index') }}" {% if active_page == 'home' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ url_for('robots') }}" {% if active_page == 'robots' %}aria-current="page"{% endif %}>Robots</a>
          <a href="{{ url_for('library') }}" {% if active_page == 'library' %}aria-current="page"{% endif %}>Library</a>
          <a href="{{ url_for('system') }}" {% if active_page == 'system' %}aria-current="page"{% endif %}>System</a>
        </nav>
      </header>

      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
