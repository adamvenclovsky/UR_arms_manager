<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} | UR Arms Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="site-header">
        <div>
          <a class="brand" href="{{ url_for('overview') }}">UR Arms Manager</a>
          <p class="tagline">Workspace control surface</p>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ url_for('overview') }}" {% if active_page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
          <a href="{{ url_for('robots') }}" {% if active_page == 'robots' %}aria-current="page"{% endif %}>Fleet</a>
          <a href="{{ url_for('library') }}" {% if active_page == 'library' %}aria-current="page"{% endif %}>Library</a>
          <a href="{{ url_for('transfer') }}" {% if active_page == 'transfer' %}aria-current="page"{% endif %}>Transfer</a>
          <a href="{{ url_for('system') }}" {% if active_page == 'system' %}aria-current="page"{% endif %}>Diagnostics</a>
        </nav>
      </aside>

      <main class="page-content workspace-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
